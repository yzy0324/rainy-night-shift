<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨夜值班室 / Night Shift Dispatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="monitor-overlay"></div>
  <button id="music-toggle" type="button" aria-pressed="false">音乐 OFF</button>

  <div id="start-screen">
    <div class="terminal-brand">
      <div class="system-status-tag">STATION SYSTEM v4.02 // ONLINE</div>
      <h1 id="game-title">雨夜值班室</h1>
      <p id="game-subtitle">Night Shift Dispatch</p>
    </div>
    <p id="atmosphere-text">雨夜值班室。电话铃响。你接起。</p>
    <button id="begin-btn">开始值班 RUN_SYSTEM</button>
    <button id="archive-open-btn" type="button">[ 档案记录 RECORDS ]</button>
  </div>

  <div id="game-screen" style="display:none;">
    <div id="desktop-layout">

      <main id="console-frame">
        <header class="console-header">
          <div class="indicator-group">
            <span class="status-dot pulsing"></span>
            <span class="panel-title-text">MAIN MONITOR / 主控制台</span>
          </div>
          <div class="system-time-stamp">SYS_LOG_REC: ACTIVE</div>
        </header>

        <div id="story-container"></div>
        <div id="choices-container"></div>
      </main>

      <aside id="clue-panel">
        <div id="clue-panel-heading">
          <span><span class="clue-icon">📊</span> 线索记录 / Clue Log</span>
          <button id="clue-panel-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div id="clue-list"></div>
      </aside>

    </div>
    <button id="clue-toggle" type="button" aria-expanded="false" aria-controls="clue-panel">线索 0 / 3</button>
  </div>

  <div id="archive-overlay" role="dialog" aria-modal="true" aria-labelledby="archive-title" style="display:none;">
    <div id="archive-panel">
      <div id="archive-header">
        <span id="archive-title">值班档案 / SHIFT RECORDS</span>
        <span id="archive-count">已记录 0 / 10</span>
        <button id="archive-close" type="button" aria-label="关闭档案">✕</button>
      </div>
      <div id="archive-list"></div>
    </div>
  </div>

  <audio id="bg-music" src="assets/audio/lost-in-grief.mp3" preload="auto" loop></audio>

  <script src="data/metadata.js"></script>
  <script src="data/scenes.js"></script>
  <script src="data/clues.js"></script>
  <script src="data/endingHints.js"></script>
  <script src="src/state.js"></script>
  <script src="src/effects.js"></script>
  <script src="src/conditions.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/archive.js"></script>
  <script src="src/ui.js"></script>
  <script src="game.js"></script>

</body>
</html>
